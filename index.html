<title>Paleo-Park Tycoon v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; --bg:#1d2419; --panel:#2b3524; --panel2:#35412c; --ink:#ecebdc; --muted:#a8ad94; --line:#4a573e; --accent:#d9a441; --bad:#e2624a; --good:#8fc46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  input, textarea { user-select: text; -webkit-user-select: text; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
  #hud { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #hud b { font-variant-numeric: tabular-nums; }
  #stage { position: relative; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #side { position: absolute; top: 8px; right: 8px; width: 290px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  #side:empty { display: none; }
  #side, #bell { z-index: 2; }   /* above the build menu's trays, so the panel's buttons always take the click */
  #bell { position: absolute; left: 84px; top: 8px; width: 260px; max-width: calc(100% - 92px); max-height: 40%; overflow: auto; background: #2b3524e6; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  #bell:empty, #bell[hidden] { display: none; }
  #bell div { padding: 2px 0; border-bottom: 1px solid #4a573e66; } #bell .bellhead { position: sticky; top: -6px; background: var(--panel); margin: -6px -8px 2px; padding: 4px 6px 4px 8px; } #bell .urgent { color: var(--bad); }
  #tools { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--line); }
  button, select { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #1d2419; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #why { color: var(--bad); margin-left: 8px; min-height: 1em; }
  #stat { color: var(--muted); margin-left: 8px; } #ask { margin-left: 8px; }
  h3 { margin: 0 0 6px; font-size: 15px; } h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 2px 0; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px; background: var(--panel2); margin: 2px 4px 2px 0; }
  .chip.bad { background: #5b2a22; color: #ffc9bd; } .chip.good { background: #2f4a25; color: #cfeab9; }
  .meter { flex: 1; height: 6px; background: #1d2419; border-radius: 3px; overflow: hidden; max-width: 120px; }
  .meter > i { display: block; height: 100%; background: var(--good); }
  .muted { color: var(--muted); }
  /* The build menu (menu.js): a column of square buttons on the left, the open tray along the bottom, its open list above it.
     Placeholder frames until the menu art lands. */
  #build { position: absolute; inset: 0; pointer-events: none; }
  #build > * { pointer-events: auto; }
  .lefttools { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .smallrow { display: flex; gap: 6px; }
  .tbtn { display: flex; align-items: center; justify-content: center; padding: 8px; border: 2px solid #141a10; border-radius: 10px; background: var(--panel); color: var(--ink); box-shadow: 0 2px 8px #0006; }
  .tbtn svg { width: 100%; height: 100%; }
  .tbtn.big { width: 64px; height: 64px; padding: 13px; }
  .tbtn.sm { width: 29px; height: 29px; padding: 3px; border-radius: 7px; }
  .tbtn:hover { background: var(--panel2); }
  .tbtn[aria-pressed="true"], .tbtn[aria-expanded="true"] { background: var(--accent); color: #1d2419; border-color: #7a5e14; }
  .tray { position: absolute; left: 84px; bottom: 8px; width: max-content; max-width: calc(100% - 92px); }
  .tray[hidden] { display: none; }
  .tray-tab { display: inline-block; margin-left: 20px; padding: 4px 16px 3px; background: var(--panel); border: 2px solid #141a10; border-bottom: 0; border-radius: 8px 8px 0 0; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; position: relative; top: 2px; }
  .traya, .ssub { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px 6px; background: var(--panel); border: 2px solid #141a10; border-radius: 12px; box-shadow: 0 4px 16px #0008; }
  .traya { padding-right: 30px; }
  .sitem { flex: none; }
  .ssub { display: none; position: absolute; bottom: calc(100% + 8px); left: 0; width: max-content; max-width: calc(100vw - 100px); }
  .sitem.open > .ssub { display: flex; }
  .srow { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; width: 84px; padding: 4px 2px; border: 0; border-radius: 8px; background: none; text-align: center; }
  .srow svg { width: 40px; height: 40px; }
  .srow b { font-size: 12px; font-weight: 600; line-height: 1.15; }
  .srow .price { font-size: 11px; color: var(--muted); }
  .srow:hover { background: var(--panel2); }
  .srow[aria-pressed="true"], .srow.head[aria-expanded="true"], .sitem.picked > .srow.head { background: var(--accent); color: #1d2419; }
  .srow[aria-pressed="true"] .price, .srow.head[aria-expanded="true"] .price, .sitem.picked > .srow.head .price { color: #1d2419; }
  .chev { position: absolute; top: 4px; right: 6px; width: 0; height: 0; border: 4px solid transparent; border-bottom: 5px solid currentColor; border-top: 0; opacity: .7; }
  .xclose { width: 22px; height: 22px; padding: 0; border: 2px solid #141a10; border-radius: 50%; background: var(--panel2); font-weight: 700; line-height: 1; flex: none; }
  .xclose:hover { background: var(--bad); }
  .xclose.a { position: absolute; top: 4px; right: 4px; z-index: 1; }
  .ssub .xclose { position: sticky; left: 0; align-self: flex-start; z-index: 1; }
  #tools { min-height: 30px; }
  .srow.locked { opacity: .4; }
  .small { font-size: 11px; }
  button.small { padding: 2px 9px; font-size: 12px; }
  .btns { display: inline-flex; gap: 6px; align-items: center; }
  .row.btns { justify-content: flex-end; gap: 6px; margin-top: 8px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; margin: 6px 0; }
  .big { font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
  .warn { color: var(--bad); font-size: 12px; margin-top: 4px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; flex: none; }
  h2 { margin: 0; font-size: 18px; }
  section > h3 { margin: 0 0 6px; }
  /* The lab panels (labs.js), after v1's: full size over the map beside the build column, sections in columns. */
  #side.full { inset: 8px 8px 8px 84px; width: auto; max-width: none; max-height: none; padding: 12px 16px; z-index: 2; }
  @media (max-width: 760px) { #side.full { inset: 0; border-radius: 0; } }
  .fcols, .fcol { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  #side.full .fcols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; align-items: start; margin-top: 10px; }
  #side.full .fcols.wide { grid-template-columns: minmax(280px, 1fr) 2fr; }
  #side.full .gt-cols { grid-template-rows: auto 1fr; }
  #side.full .gt-cols > :nth-child(2) { grid-column: 2; grid-row: 1 / 3; }
  #side.full .gt-cols > :nth-child(3) { grid-column: 1; grid-row: 2; }
  #side.full .gt-map { width: min(100%, 140vh); margin: 8px auto 4px; }
  #side.full .fcol .shop { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); align-items: start; }
  @media (max-width: 1000px) { #side.full .fcols { display: flex; align-items: stretch; } #side.full .fcol .shop { display: flex; align-items: stretch; } }
  .bay { min-height: 70px; }
  .bay.empty { background: none; border-style: dashed; display: flex; align-items: center; gap: 8px; }
  .bay .bn { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .bay .barline { margin: 6px 0 3px; display: flex; } .bay .barline .meter { max-width: none; }
  .bay button { margin-top: 6px; }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; }
  .shop { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .shop li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
  .shop li.locked { opacity: .6; }
  .shop .nm { font-weight: 600; display: flex; align-items: center; gap: 4px 7px; flex-wrap: wrap; min-width: 0; }
  .shop .per { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .shop .need { grid-column: 1 / -1; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .shop .chip { margin: 0; }
  button.buy { border-color: var(--accent); background: var(--accent); color: #1d2419; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  button.buy:disabled { background: transparent; color: var(--muted); border-color: var(--line); opacity: 1; }
  .ptabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-top: 8px; }
  .ptab { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; background: transparent; color: var(--muted); box-shadow: inset 0 -3px 0 var(--pc); }
  .ptab[aria-selected="true"] { background: var(--panel2); color: var(--ink); font-weight: 600; border-color: var(--muted); }
  .ptab-body { padding-top: 10px; }
  /* The Time Travel Lab: the timeline slider (a bar a period, a slice an epoch), the epoch's map with its sites, the site card. */
  .gt-epoch { display: block; font-size: 20px; line-height: 1.1; }
  .gt-ago { font-weight: 600; font-variant-numeric: tabular-nums; }
  .gt-period { display: flex; align-items: center; gap: 6px; }
  .gt-map { display: block; width: 100%; aspect-ratio: 2 / 1; margin: 8px 0 4px; image-rendering: pixelated; shape-rendering: crispEdges; cursor: pointer; border: 2px solid #141a10; border-radius: 4px; }
  .gt-map image { image-rendering: pixelated; }
  .gt-frame { fill: #454646; } .gt-site.on .gt-frame { fill: #fff; }
  .gt-track { position: relative; height: 36px; touch-action: none; cursor: pointer; outline: none; }
  .gt-bars { position: absolute; inset: 8px 0; display: flex; gap: 2px; }
  .gt-bar { flex: 1; display: flex; border-radius: 3px; overflow: hidden; min-width: 0; }
  .gt-bar i { flex: 1; }
  .gt-thumb { position: absolute; top: 0; bottom: 0; width: 0; pointer-events: none; }
  .gt-thumb::before { content: ""; position: absolute; left: -1.5px; top: 4px; bottom: 4px; width: 3px; background: var(--ink); border-radius: 2px; }
  .gt-thumb::after { content: ""; position: absolute; left: -6px; top: 0; width: 12px; height: 7px; background: var(--ink); clip-path: polygon(0 0, 100% 0, 50% 100%); }
  .gt-track:focus-visible .gt-thumb::before { box-shadow: 0 0 0 3px var(--accent); }
  .gt-labels { display: flex; gap: 2px; margin: -2px 0 8px; }
  .gt-labels span { flex: 1; min-width: 0; font-size: 10px; color: var(--muted); text-align: center; overflow: hidden; white-space: nowrap; }
  .gt-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .gt-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; }
  .gt-chip[aria-pressed="true"] { border-color: var(--ink); background: var(--panel2); color: var(--ink); }
  .gt-chip i { width: 8px; height: 8px; box-shadow: inset 0 0 0 2px #454646; }
  .gt-done { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .gt-name { font-size: 17px; }
  .gt-badge { display: inline-block; vertical-align: middle; margin-left: 6px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 3px 5px; border-radius: 4px; background: #D9FF00; color: #1d2419; }
  .gt-targets { width: 100%; border-collapse: collapse; margin-top: 8px; }
  .gt-targets th { text-align: left; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .gt-targets th:not(:first-child), .gt-targets td:not(:first-child) { text-align: right; padding-left: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .gt-targets td { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .gt-targets tr.locked td { color: var(--muted); }
  .gt-targets label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .gt-tag { font-size: 11px; color: var(--muted); white-space: nowrap; }
  .gt-drone { min-height: 0; }
  .gt-report { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-top: 8px; display: grid; gap: 5px; justify-items: start; }
  .gt-rh { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .gt-report ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
  .gt-report li.big { font-size: 15px; font-weight: 600; }
</style>
<div id="app">
  <div id="hud"></div>
  <div id="stage"><canvas id="view"></canvas><div id="bell" hidden></div><div id="side"></div><div id="build"></div></div>
  <div id="tools"></div>
</div>
<script type="module" src="src/main.js"></script>
