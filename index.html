<title>Paleo-Park Tycoon v2</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; --bg:#1d2419; --panel:#2b3524; --panel2:#35412c; --ink:#ecebdc; --muted:#a8ad94; --line:#4a573e; --accent:#d9a441; --bad:#e2624a; --good:#8fc46a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.35 system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  input, textarea { user-select: text; -webkit-user-select: text; }
  #app { display: grid; grid-template-rows: auto 1fr auto; height: 100%; }
  #hud { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #hud b { font-variant-numeric: tabular-nums; }
  #stage { position: relative; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  #side { position: absolute; top: 8px; right: 8px; width: 290px; max-width: calc(100% - 16px); max-height: calc(100% - 16px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  #side:empty { display: none; }
  #side, #bell { z-index: 2; }   /* above the build menu's trays, so the panel's buttons always take the click */
  #bell { position: absolute; left: 84px; top: 8px; width: 260px; max-width: calc(100% - 92px); max-height: 40%; overflow: auto; background: #2b3524e6; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  #bell:empty, #bell[hidden] { display: none; }
  #bell div { padding: 2px 0; border-bottom: 1px solid #4a573e66; } #bell .bellhead { position: sticky; top: -6px; background: var(--panel); margin: -6px -8px 2px; padding: 4px 6px 4px 8px; } #bell .urgent { color: var(--bad); }
  #tools { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 8px; background: var(--panel); border-top: 1px solid var(--line); }
  button, select { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #1d2419; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #why { color: var(--bad); margin-left: 8px; min-height: 1em; }
  #stat { color: var(--muted); margin-left: 8px; } #ask { margin-left: 8px; }
  h3 { margin: 0 0 6px; font-size: 15px; } h4 { margin: 10px 0 4px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: center; margin: 2px 0; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px; background: var(--panel2); margin: 2px 4px 2px 0; }
  .chip.bad { background: #5b2a22; color: #ffc9bd; } .chip.good { background: #2f4a25; color: #cfeab9; }
  .meter { flex: 1; height: 6px; background: #1d2419; border-radius: 3px; overflow: hidden; max-width: 120px; }
  .meter > i { display: block; height: 100%; background: var(--good); }
  .muted { color: var(--muted); }
  /* The build menu (menu.js): a column of square buttons on the left, the open tray along the bottom, its open list above it.
     Placeholder frames until the menu art lands. */
  #build { position: absolute; inset: 0; pointer-events: none; }
  #build > * { pointer-events: auto; }
  .lefttools { position: absolute; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .smallrow { display: flex; gap: 6px; }
  .tbtn { display: flex; align-items: center; justify-content: center; padding: 8px; border: 2px solid #141a10; border-radius: 10px; background: var(--panel); color: var(--ink); box-shadow: 0 2px 8px #0006; }
  .tbtn svg { width: 100%; height: 100%; }
  .tbtn.big { width: 64px; height: 64px; padding: 13px; }
  .tbtn.sm { width: 29px; height: 29px; padding: 3px; border-radius: 7px; }
  .tbtn:hover { background: var(--panel2); }
  .tbtn[aria-pressed="true"], .tbtn[aria-expanded="true"] { background: var(--accent); color: #1d2419; border-color: #7a5e14; }
  .tray { position: absolute; left: 84px; bottom: 8px; width: max-content; max-width: calc(100% - 92px); }
  .tray[hidden] { display: none; }
  .tray-tab { display: inline-block; margin-left: 20px; padding: 4px 16px 3px; background: var(--panel); border: 2px solid #141a10; border-bottom: 0; border-radius: 8px 8px 0 0; font-weight: 700; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; position: relative; top: 2px; }
  .traya, .ssub { display: flex; gap: 4px; overflow-x: auto; padding: 8px 10px 6px; background: var(--panel); border: 2px solid #141a10; border-radius: 12px; box-shadow: 0 4px 16px #0008; }
  .traya { padding-right: 30px; }
  .sitem { flex: none; }
  .ssub { display: none; position: absolute; bottom: calc(100% + 8px); left: 0; width: max-content; max-width: calc(100vw - 100px); }
  .sitem.open > .ssub { display: flex; }
  .srow { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; flex: none; width: 84px; padding: 4px 2px; border: 0; border-radius: 8px; background: none; text-align: center; }
  .srow svg { width: 40px; height: 40px; }
  .srow b { font-size: 12px; font-weight: 600; line-height: 1.15; }
  .srow .price { font-size: 11px; color: var(--muted); }
  .srow:hover { background: var(--panel2); }
  .srow[aria-pressed="true"], .srow.head[aria-expanded="true"], .sitem.picked > .srow.head { background: var(--accent); color: #1d2419; }
  .srow[aria-pressed="true"] .price, .srow.head[aria-expanded="true"] .price, .sitem.picked > .srow.head .price { color: #1d2419; }
  .chev { position: absolute; top: 4px; right: 6px; width: 0; height: 0; border: 4px solid transparent; border-bottom: 5px solid currentColor; border-top: 0; opacity: .7; }
  .xclose { width: 22px; height: 22px; padding: 0; border: 2px solid #141a10; border-radius: 50%; background: var(--panel2); font-weight: 700; line-height: 1; flex: none; }
  .xclose:hover { background: var(--bad); }
  .xclose.a { position: absolute; top: 4px; right: 4px; z-index: 1; }
  .ssub .xclose { position: sticky; left: 0; align-self: flex-start; z-index: 1; }
  #tools { min-height: 30px; }
  .srow.locked { opacity: .4; }
  #side.wide { width: 420px; }
  .small { font-size: 11px; }
  .row.btns { justify-content: flex-end; gap: 6px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  .perbar { display: flex; gap: 2px; margin: 4px 0 6px; }
  .perbar .per { flex: 1; padding: 3px 0; font-size: 11px; display: flex; flex-direction: column; align-items: center; line-height: 1.1; color: var(--muted); }
  .perbar .per.has { color: var(--ink); }
  .perbar .per i { font-style: normal; color: var(--accent); font-size: 10px; height: 10px; }
  .perbar .per[aria-pressed="true"] i { color: #1d2419; }
  .perbar.eps .per { font-size: 11px; padding: 3px 2px; }
  /* The Time Travel Lab's map: the 260 x 130 picture scaled up pixel-sharp, site markers over it (lit once scouted). */
  .ttmap { position: relative; margin: 4px 0 2px; border: 2px solid #141a10; border-radius: 4px; overflow: hidden; line-height: 0; }
  .ttmap img { width: 100%; height: auto; image-rendering: pixelated; }
  .ttmap .mark { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; padding: 0; border: 2px solid #1d2419; border-radius: 2px; background: #a8ad94; }
  .ttmap .mark.lit { background: var(--accent); }
  .ttmap .mark[aria-pressed="true"] { border-color: #fff; }
  .credit { margin-bottom: 4px; }
  .card.sel { border-color: var(--accent); }
</style>
<div id="app">
  <div id="hud"></div>
  <div id="stage"><canvas id="view"></canvas><div id="bell" hidden></div><div id="side"></div><div id="build"></div></div>
  <div id="tools"></div>
</div>
<script type="module" src="src/main.js"></script>
